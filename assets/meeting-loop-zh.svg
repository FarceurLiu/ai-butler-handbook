<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 980" role="img" aria-labelledby="ml-title ml-desc">
  <title id="ml-title">會議整理的分工與修改循環</title>
  <desc id="ml-desc">你提供本次筆記，整理助理做待辦表，核對助理對照原文。符合要求就交付；未符合時，若有權限且尚未修改兩輪，只修列出的問題再核對，否則停止並交給你判斷。本例的兩輪是教學設定。</desc>
  <defs><marker id="ml-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
  <rect width="460" height="980" fill="#fff"/>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ml-arrow)">
    <path d="M230 86V126"/><path d="M230 216V256"/><path d="M230 356V390"/>
    <path d="M230 510V544"/>
    <path d="M375 450H428V908H376"/>
    <path d="M230 684V736"/>
    <path d="M85 614H28V171H84" stroke-dasharray="7 5"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5" fill="#f8fafc">
    <rect x="85" y="16" width="290" height="70" rx="35"/>
    <rect x="85" y="126" width="290" height="90"/>
    <rect x="85" y="256" width="290" height="100"/>
    <path d="M230 390L375 450L230 510L85 450Z"/>
    <path d="M230 544L375 614L230 684L85 614Z"/>
    <rect x="85" y="736" width="290" height="100" rx="30" fill="#fff7ed" stroke="#9a3412"/>
    <rect x="85" y="868" width="290" height="80" rx="35" fill="#ecfdf5" stroke="#047857"/>
  </g>
  <g font-family="PingFang TC,Microsoft JhengHei,sans-serif" fill="#0f172a" text-anchor="middle" font-size="21">
    <text x="230" y="59">你提供本次筆記</text>
    <text x="230" y="164" font-weight="600">整理助理</text><text x="230" y="193">做成待辦表</text>
    <text x="230" y="296" font-weight="600">核對助理</text><text x="230" y="328">逐項對照原筆記</text>
    <text x="230" y="458">符合要求？</text>
    <text x="230" y="609">有權限，且</text><text x="230" y="636">未滿兩輪？</text>
    <text x="230" y="774" font-weight="600">停止</text><text x="230" y="803">保留結果與問題，問你</text>
    <text x="230" y="916" font-weight="600">交付給你確認</text>
  </g>
  <g font-family="PingFang TC,Microsoft JhengHei,sans-serif" fill="#334155" font-size="20">
    <text x="391" y="435">是</text><text x="242" y="535">否</text><text x="242" y="720">否</text>
    <text x="37" y="596">是</text>
    <text x="39" y="230"><tspan x="39">只</tspan><tspan x="39" dy="25">修</tspan><tspan x="39" dy="25">問</tspan><tspan x="39" dy="25">題</tspan></text>
  </g>
</svg>
